# Dist-repo release finalizer (synchronized into the public dist repo at
# .github/workflows/publish.yml by scripts/publish-release.ps1).
#
# The local script builds agate.exe, builds and signs latest.json, pushes the
# metadata tree (LICENSE, VERSION, plugins/, sha256sums.txt, latest.json) and
# creates a *draft* release with the exe as an asset. This workflow then flips the
# draft to a published `--latest` release and commits the release index
# (releases.md). latest.json is owned by the local script, so the signed pointer
# and the asset it names are always published together; this workflow never
# rewrites latest.json (no jq regeneration on the CI side).
#
# Trigger is workflow_dispatch only (never `release: published`), so unpublishing
# the draft cannot recurse back into this workflow. No source code is present in
# this repository; the binary exists only as a release asset.
name: publish-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the tag prefix, e.g. 0.3.39"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "publish-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches the dispatched version
        run: test "$(tr -d '[:space:]' < VERSION)" = "${{ inputs.version }}"

      - name: Publish the draft release as latest
        run: >
          gh release edit "v${{ inputs.version }}"
          --draft=false
          --title "Agate ${{ inputs.version }}"
          --latest

      - name: Regenerate release index
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,name,publishedAt,isLatest > /tmp/rel.json
          {
            echo "# Releases"
            echo
            echo "| Version | Tag | Published | Latest |"
            echo "|---|---|---|---|"
            jq -r 'sort_by(.publishedAt) | reverse | .[]
                   | "| \(.name) | \(.tagName) | \(.publishedAt) | \(if .isLatest then "yes" else "" end) |"' \
              /tmp/rel.json
          } > releases.md

      - name: Commit metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.md
          git diff --cached --quiet || git commit -m "chore: metadata ${{ inputs.version }}"
          git push
